name: CI/CD + Security Pipeline

on:
  push:
    branches:
      - main

jobs:

  test:
    name: Run Tests with JaCoCo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Usamos JDK 21 que es tu versión instalada para que compile nativo
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Mantiene la caché que les dio el profe
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      # Excluimos la autoconfiguración de la base de datos para saltar el error de credenciales
      - name: Run tests
        run: mvn clean verify -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

      # Sube el reporte de JaCoCo tal cual lo configuró el profesor
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Compila el archivo ejecutable de la app
      - name: Build JAR
        run: mvn clean package -DskipTests

      # Guarda el JAR final como artefacto
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar